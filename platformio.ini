; Space Apps 2026 - polsstation (XIAO ESP32-S3)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiao_esp32s3

[env]
platform = espressif32@7.1.3
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
	-I include
	-DCORE_DEBUG_LEVEL=1
; BLE zit al in de core
lib_deps =
	adafruit/Adafruit SSD1306@2.5.17
	adafruit/Adafruit GFX Library@1.13.0
	adafruit/Adafruit BusIO@1.17.4
	adafruit/Adafruit Unified Sensor@1.1.15
	adafruit/Adafruit MCP9808 Library@2.0.2
	adafruit/Adafruit MPU6050@2.2.9
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
	sensirion/Sensirion I2C SCD4x@1.1.0

[env:xiao_esp32s3]

; losse hardwaretests staan in hw_tests/<naam>/
[env:test_i2c_scan]
build_src_filter = -<*> +<../hw_tests/i2c_scan/>

[env:test_motion]
build_src_filter = -<*> +<motion.cpp> +<../hw_tests/motion/>

[env:test_oled]
build_src_filter = -<*> +<../hw_tests/oled/>

[env:test_oled_sh1106]
build_src_filter = -<*> +<../hw_tests/oled_sh1106/>
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit SH110X@2.1.10
